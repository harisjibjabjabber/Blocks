<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocks</title>
    <style>
      @font-face { font-family: 'Instrument Serif'; src: url('./fonts/Instrument%20Serif/InstrumentSerif-Regular.ttf') format('truetype'); font-display: swap; }
      @font-face { font-family: 'Inter Tight'; src: url('./fonts/Inter%20Tight/InterTight-VariableFont_wght.ttf') format('truetype'); font-weight: 100 900; font-display: swap; }
      @font-face { font-family: 'Geist Mono'; src: url('./fonts/Geist%20Mono/GeistMono-VariableFont_wght.ttf') format('truetype'); font-weight: 100 900; font-display: swap; }
      html, body, #root { height: 100%; margin: 0; background: #1a1714; overflow: hidden; }
      #root { display: flex; flex-direction: column; }
      #root > div, #root > div > div { height: 100%; min-height: 0; flex: 1; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
