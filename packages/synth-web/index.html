<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c0f12">
  <title>Blocks — Synth</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="instrument" aria-label="Blocks synthesizer">
    <header class="instrument-header">
      <span class="brand">BLOCKS <span>/ SOUND</span></span>
      <button id="undo" class="icon-button" aria-label="Undo sound edit" title="Undo sound edit" disabled><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="m9 5-5 5 5 5M4 10h10a5 5 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </header>
    <section class="patch-heading" aria-label="Instrument patch">
      <span class="eyebrow">SYNTH</span>
      <h1><label class="sr-only" for="presets">Preset</label><select id="presets" aria-label="Preset"><option value="velvet">Velvet Current</option><option value="glass">Glass Garden</option><option value="low">Low Tide</option></select></h1>
    </section>
    <div class="audio-controls" aria-label="Sound and MIDI">
      <button id="start" class="primary">Start sound</button>
      <button id="stop" disabled>Stop</button>
      <button id="midi" disabled>Connect MIDI</button>
    </div>
    <div class="signal-row"><span id="status" role="status">Sound stopped</span><canvas id="scope" aria-label="Actual synth output waveform"></canvas><span id="monitor">0 voices</span></div>
    <nav id="module-tabs" aria-label="Sound module">
      <button type="button" data-module="tone" class="selected" aria-pressed="true">Tone</button>
      <button type="button" data-module="envelope" aria-pressed="false">Envelope</button>
      <button type="button" data-module="character" aria-pressed="false">Character</button>
      <button type="button" data-module="drop" aria-pressed="false"><span>Pitch Drop</span><small>Sauce</small></button>
    </nav>
    <section class="sound-editor" aria-label="Sound editing">
      <div class="visual-panel">
        <div class="surface-heading"><h2 id="module-title">Oscillator + filter</h2><output id="value-summary" aria-live="off"></output></div>
        <div id="shape-surface" aria-label="Interactive sound graph"></div>
        <p id="module-description">Drag the filter point to change tone.</p>
      </div>
      <div id="macros" aria-label="Sound controls"></div>
    </section>
    <section class="keyboard-section" aria-label="Touch instrument">
      <div class="keyboard-heading"><span>Keyboard</span><div class="octave-controls" aria-label="Keyboard octave"><button id="octave-down" type="button" aria-label="Lower keyboard octave">−</button><span id="octave-label" aria-live="polite">C4</span><button id="octave-up" type="button" aria-label="Higher keyboard octave">+</button></div></div>
      <div class="keyboard" id="keyboard" aria-label="Playable piano"></div>
    </section>
    <div class="utilities">
      <div id="parameters"></div>
      <details class="patch-files"><summary>Patch</summary><div class="patch-tools"><button id="init" disabled>Init patch</button><button id="export" disabled>Export patch</button><label class="file">Import patch<input id="import" type="file" accept=".json,application/json" disabled></label></div></details>
    </div>
    <p id="error" role="alert"></p>
  </main>
  <script type="module" src="./host.js"></script>
</body>
</html>
