<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c0f12">
  <title>Blocks — Synth</title>
  <link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="dial-reset.css">
<link rel="stylesheet" href="output-ui.css">
<link rel="stylesheet" href="sound-ui.css">
</head>
<body>
  <main class="instrument" aria-label="Blocks synthesizer">
    <header class="instrument-header">
      <span class="brand">BLOCKS <span>/ SOUND</span></span>
      <div class="header-actions">
        <button id="undo" class="icon-button" aria-label="Undo sound edit" title="Undo sound edit" disabled><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M9 5 4 10l5 5M4 10h10a5 5 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button id="volume-toggle" type="button" aria-expanded="false" aria-controls="volume-panel"><svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M3 8h3l4-4v12l-4-4H3ZM13 6q5 4 0 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg><span>Volume</span><span id="peak-indicator" aria-hidden="true"></span></button>
        <div id="volume-panel" role="group" aria-label="Output volume" hidden><div class="volume-caption"><label for="volume-range">Output volume</label><output id="volume-value" for="volume-range">—</output></div><input id="volume-range" type="range" min="0" max="100" step="1" value="30" aria-label="Output volume"><div class="peak-row"><span id="peak-readout">Peak —</span><button id="peak-reset" type="button" aria-label="Clear peak indicator">Clear peak</button></div></div>
      </div>
    </header>
    <div class="patch-toolbar"><section class="patch-heading" aria-label="Instrument patch">
      <span class="eyebrow">SYNTH</span>
      <h1><label class="sr-only" for="presets">Preset</label><select id="presets" aria-label="Preset"><option value="velvet">Velvet Current</option><option value="glass">Glass Garden</option><option value="low">Low Tide</option></select></h1>
    </section>
    <div class="audio-controls" aria-label="Sound and MIDI">
      <button id="start" class="primary">Start sound</button>
      <button id="stop" disabled>Stop</button>
      <button id="midi" disabled>Connect MIDI</button>
    </div>
    </div>
    <div class="signal-row"><span id="status" role="status">Sound stopped</span><span id="monitor">0 voices</span></div>
    <nav id="module-tabs" aria-label="Sound module">
      <button type="button" data-module="tone" class="selected" aria-pressed="true">Tone</button>
      <button type="button" data-module="envelope" aria-pressed="false">Envelope</button>
      <button type="button" data-module="character" aria-pressed="false">Character</button>
      <button type="button" data-module="drop" aria-pressed="false">Sauce</button>
      <button type="button" data-module="lfo" aria-pressed="false">LFO</button>
    </nav>
    <div id="sauce-rack" hidden></div>
    <section id="sauce-output" hidden aria-label="Sauce output effects"></section>
    <section id="sound-editor" class="sound-editor" aria-label="Sound editing">
      <div id="tone-layout" hidden>
        <div class="tone-source-bar"><div id="tone-source"></div><span>Shared by both oscillators</span></div>
        <div class="tone-cards"><div id="tone-oscillators"></div><section id="tone-filter" class="tone-filter-panel" aria-label="Shared filter"><div class="tone-filter-heading"><h2>Filter</h2><div id="tone-filter-mode"></div></div><div id="filter-routing" role="group" aria-label="Oscillators affected by Tone filter"><span>Affects</span><button type="button" data-filter-osc="osc1" aria-pressed="true" aria-label="Filter Oscillator 1">Osc 1</button><button type="button" data-filter-osc="osc2" aria-pressed="true" aria-label="Filter Oscillator 2">Osc 2</button></div></section></div>
        <div id="tone-shared" class="tone-shared"></div>
      </div>
      <div class="visual-panel">
        <div class="surface-heading"><div id="envelope-tabs" role="group" aria-label="Envelope destination" hidden><button type="button" data-envelope="amp" aria-pressed="true">Amp</button><button type="button" data-envelope="filter" aria-pressed="false">Filter</button></div><button id="motion-details-toggle" type="button" aria-expanded="false" aria-controls="motion-details" hidden>Pitch details <span aria-hidden="true">⌄</span></button><h2 id="module-title">Oscillator + filter</h2><output id="value-summary" aria-live="off"></output></div>
        <div id="waveforms" aria-label="Oscillator waveforms" hidden></div>
        <div id="scope-wrapper" hidden><div class="waveform-caption"><span>Waveform</span><span id="scope-label">Preview</span></div><canvas id="scope" aria-label="Synth waveform preview"></canvas></div>
        <div id="shape-surface" aria-label="Interactive sound graph"></div>
        <div id="performance-panel" hidden></div>
        <div id="lfo-panel" hidden></div>
        <div id="motion-details" role="group" aria-label="Pitch details" hidden><div class="motion-details-heading"><span>Pitch</span><button id="motion-details-close" type="button" aria-label="Close Pitch details">×</button></div><div id="motion-controls"></div></div>
        <p id="module-description">Drag the filter point to change tone.</p>
      </div>
      <div id="macros" aria-label="Sound controls"></div>
    </section>
    <section class="keyboard-section" aria-label="Touch instrument">
      <div class="keyboard-heading"><span>Keyboard</span><div class="keyboard-performance"><button id="mono-toggle" type="button" aria-pressed="false" title="Mono · last note priority">Mono</button><button id="glide-toggle" type="button" aria-pressed="false">Glide</button><button id="glide-time-toggle" type="button" aria-expanded="false" aria-controls="glide-panel" hidden>80 ms</button><div id="glide-panel" role="group" aria-label="Glide time" hidden></div><div class="octave-controls" aria-label="Keyboard octave"><button id="octave-down" type="button" aria-label="Lower keyboard octave">−</button><span id="octave-label" aria-live="polite">C4</span><button id="octave-up" type="button" aria-label="Higher keyboard octave">+</button></div></div></div>
      <div class="keyboard" id="keyboard" aria-label="Playable piano"></div>
    </section>
    <div class="utilities">
      <div id="parameters"></div><span id="filter-resonance-help" class="sr-only">Resonance is available in Resonant LP12 mode. Its stored amount is retained in Soft mode.</span>
      <details class="patch-files"><summary>Patch</summary><div class="patch-tools"><button id="init" disabled>Init patch</button><button id="export" disabled>Export patch</button><label class="file">Import patch<input id="import" type="file" accept=".json,application/json" disabled></label></div></details>
    </div>
    <p id="error" role="alert"></p>
  </main>
  <script type="module" src="./host.js"></script>
</body>
</html>
