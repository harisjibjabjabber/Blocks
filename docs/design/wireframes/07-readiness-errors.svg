<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 726" width="1080" height="726" font-family="Inter, Roboto, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Readiness &amp; error states (input + audio) (PROPOSED)</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="0" y="0" width="1080" height="620" rx="8" fill="#FFFFFF" stroke="#1F2328" stroke-width="2"/>
<text x="1072" y="612" font-size="9" text-anchor="end" fill="#5B6470" font-weight="400">PROPOSED · not implemented · sizes are proposals pending measurement</text>
<rect x="8" y="8" width="260" height="288" rx="8" fill="#FFF4D6" stroke="#B7791F" stroke-width="1.5"/>
<text x="22" y="38" font-size="14" text-anchor="start" fill="#1F2328" font-weight="600">Web MIDI not supported</text>
<text x="22" y="64" font-size="11" text-anchor="start" fill="#1F2328" font-weight="400">This browser can&#x27;t read MIDI keyboards.</text>
<text x="22" y="112" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">Use Chrome/Edge/Firefox desktop or</text>
<text x="22" y="128" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">Chrome on Android, or play touch keys.</text>
<rect x="22" y="172" width="232" height="52" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="138.0" y="202.55" font-size="13" text-anchor="middle" fill="#1F2328" font-weight="400">Use touch keys</text>
<rect x="22" y="232" width="232" height="48" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="138.0" y="260.2" font-size="12" text-anchor="middle" fill="#1F2328" font-weight="400">Copy link</text>
<rect x="276" y="8" width="260" height="288" rx="8" fill="#FFF4D6" stroke="#B7791F" stroke-width="1.5"/>
<text x="290" y="38" font-size="14" text-anchor="start" fill="#1F2328" font-weight="600">MIDI access blocked</text>
<text x="290" y="64" font-size="11" text-anchor="start" fill="#1F2328" font-weight="400">You (or a policy) blocked MIDI for this</text>
<text x="290" y="80" font-size="11" text-anchor="start" fill="#1F2328" font-weight="400">site.</text>
<text x="290" y="112" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">Open the site settings (lock icon) →</text>
<text x="290" y="128" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">MIDI → Allow, then retry.</text>
<rect x="290" y="172" width="232" height="52" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="406.0" y="202.55" font-size="13" text-anchor="middle" fill="#1F2328" font-weight="400">Retry</text>
<rect x="290" y="232" width="232" height="48" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="406.0" y="260.2" font-size="12" text-anchor="middle" fill="#1F2328" font-weight="400">How to allow</text>
<rect x="544" y="8" width="260" height="288" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="558" y="38" font-size="14" text-anchor="start" fill="#1F2328" font-weight="600">Sound is paused</text>
<text x="558" y="64" font-size="11" text-anchor="start" fill="#1F2328" font-weight="400">The browser or OS paused audio (call,</text>
<text x="558" y="80" font-size="11" text-anchor="start" fill="#1F2328" font-weight="400">other app).</text>
<text x="558" y="112" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">If your keyboard is still sending,</text>
<text x="558" y="128" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">playing is kept. Tap to resume.</text>
<rect x="558" y="172" width="232" height="52" rx="8" fill="#2F6FEB" stroke="#2F6FEB" stroke-width="1"/>
<text x="674.0" y="202.55" font-size="13" text-anchor="middle" fill="#FFFFFF" font-weight="600">Resume sound</text>
<rect x="812" y="8" width="260" height="288" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="826" y="38" font-size="14" text-anchor="start" fill="#1F2328" font-weight="600">Keystation 61 disconnected</text>
<text x="826" y="64" font-size="11" text-anchor="start" fill="#1F2328" font-weight="400">Held notes stopped (marked, not in your</text>
<text x="826" y="80" font-size="11" text-anchor="start" fill="#1F2328" font-weight="400">take). History kept.</text>
<text x="826" y="112" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">Reconnect and keep playing — we&#x27;ll pick</text>
<text x="826" y="128" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">it up automatically.</text>
<rect x="826" y="172" width="232" height="52" rx="8" fill="#2F6FEB" stroke="#2F6FEB" stroke-width="1"/>
<text x="942.0" y="202.55" font-size="13" text-anchor="middle" fill="#FFFFFF" font-weight="600">Use touch keys</text>
<rect x="826" y="232" width="232" height="48" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="942.0" y="260.2" font-size="12" text-anchor="middle" fill="#1F2328" font-weight="400">Choose device</text>
<rect x="8" y="308" width="260" height="288" rx="8" fill="#FFF4D6" stroke="#B7791F" stroke-width="1.5"/>
<text x="22" y="338" font-size="14" text-anchor="start" fill="#1F2328" font-weight="600">No keyboard found</text>
<text x="22" y="364" font-size="11" text-anchor="start" fill="#1F2328" font-weight="400">Nothing is plugged in or paired.</text>
<text x="22" y="412" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">Plug in USB (OTG) or pair Bluetooth</text>
<text x="22" y="428" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">MIDI.</text>
<rect x="22" y="472" width="232" height="52" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="138.0" y="502.55" font-size="13" text-anchor="middle" fill="#1F2328" font-weight="400">Scan Bluetooth</text>
<rect x="22" y="532" width="232" height="48" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="138.0" y="560.2" font-size="12" text-anchor="middle" fill="#1F2328" font-weight="400">Use touch keys</text>
<rect x="276" y="308" width="260" height="288" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="290" y="338" font-size="14" text-anchor="start" fill="#1F2328" font-weight="600">Connected, silent</text>
<text x="290" y="364" font-size="11" text-anchor="start" fill="#1F2328" font-weight="400">Device present, but no notes for 10 s</text>
<text x="290" y="380" font-size="11" text-anchor="start" fill="#1F2328" font-weight="400">while you&#x27;re on this screen.</text>
<text x="290" y="412" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">Check MIDI channel/local control or try</text>
<text x="290" y="428" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">another port.</text>
<rect x="290" y="472" width="232" height="52" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="406.0" y="502.55" font-size="13" text-anchor="middle" fill="#1F2328" font-weight="400">Choose port</text>
<rect x="290" y="532" width="232" height="48" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="406.0" y="560.2" font-size="12" text-anchor="middle" fill="#1F2328" font-weight="400">Test again</text>
<rect x="544" y="308" width="260" height="288" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="558" y="338" font-size="14" text-anchor="start" fill="#1F2328" font-weight="600">Not a secure page</text>
<text x="558" y="364" font-size="11" text-anchor="start" fill="#1F2328" font-weight="400">MIDI and audio need https.</text>
<text x="558" y="412" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">Open the https address.</text>
<rect x="558" y="472" width="232" height="52" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="674.0" y="502.55" font-size="13" text-anchor="middle" fill="#1F2328" font-weight="400">Open https</text>
<rect x="812" y="308" width="260" height="288" rx="8" fill="#FFF4D6" stroke="#B7791F" stroke-width="1.5"/>
<text x="826" y="338" font-size="14" text-anchor="start" fill="#1F2328" font-weight="600">Audio output error</text>
<text x="826" y="364" font-size="11" text-anchor="start" fill="#1F2328" font-weight="400">No output device could start.</text>
<text x="826" y="412" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">Check volume/headphones, then retry.</text>
<rect x="826" y="472" width="232" height="52" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="942.0" y="502.55" font-size="13" text-anchor="middle" fill="#1F2328" font-weight="400">Retry</text>
<rect x="826" y="532" width="232" height="48" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="942.0" y="560.2" font-size="12" text-anchor="middle" fill="#1F2328" font-weight="400">Settings</text>
<circle cx="20" cy="14" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="0"/><text x="20" y="18" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">1</text>
<circle cx="288" cy="14" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="0"/><text x="288" y="18" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">2</text>
<circle cx="556" cy="14" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="0"/><text x="556" y="18" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text>
<circle cx="14" cy="644" r="8" fill="#0E7C86"/><text x="14" y="648" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">1</text>
<text x="28" y="648" font-size="11" fill="#1F2328">Every state: title says what happened, line 2 says what is still safe, button says the next action. Icon + text, never colour alone.</text>
<circle cx="14" cy="666" r="8" fill="#0E7C86"/><text x="14" y="670" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">2</text>
<text x="28" y="670" font-size="11" fill="#1F2328">Denied permission cannot be re-prompted by script once blocked by policy; the card gives the manual route instead of a dead button.</text>
<circle cx="14" cy="688" r="8" fill="#0E7C86"/><text x="14" y="692" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text>
<text x="28" y="692" font-size="11" fill="#1F2328">Audio paused: Capture continues only while MIDI delivery continues (A1). Hidden tab / background: delivery not guaranteed; on return, gaps are flagged.</text>
</svg>