<circle cx="12" cy="488" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/><text x="12" y="492" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">10</text>
<rect x="8" y="552" width="344" height="112" rx="12" fill="url(#cap)" stroke="none" stroke-width="0"/>
<line x1="20" y1="553" x2="340" y2="553" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>
<text x="180" y="600" font-size="26" text-anchor="middle" fill="#120C0A" font-weight="750" letter-spacing="-0.4">Capture</text>
<text x="180" y="628" font-size="12" text-anchor="middle" fill="#120C0A" font-weight="400">last phrase → Layer 2</text>
<text x="180" y="648" font-size="10" text-anchor="middle" fill="#120C0A" font-weight="400">optional mapping: CC 67</text>
<circle cx="20" cy="560" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/><text x="20" y="564" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">11</text>
<rect x="8" y="676" width="344" height="56" rx="12" fill="url(#ctl)" stroke="#2A3038" stroke-width="1"/>
<line x1="20" y1="677" x2="340" y2="677" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
<text x="180.0" y="708.55" font-size="13" text-anchor="middle" fill="#ECEEF2" font-weight="500" letter-spacing="0.2">Touch keys (on screen) ▴</text>
<circle cx="20" cy="680" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/><text x="20" y="684" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">12</text>
<text x="180" y="760" font-size="9" text-anchor="middle" fill="#9AA3AF" font-weight="400">Live region: &#x27;Captured 8 bars at 92 BPM into layer 2. Looping.&#x27;</text>
<circle cx="398" cy="24" r="8" fill="#0E7C86"/><text x="398" y="28" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">1</text>
<text x="412" y="28" font-size="11" fill="#1F2328">Sketch menu: library, rename, save state, export. One</text>
<text x="412" y="44" font-size="11" fill="#1F2328">sketch = one shared tempo/meter + its parts (first slice:</text>
<text x="412" y="60" font-size="11" fill="#1F2328">one part; four is a milestone, not a max).</text>
<circle cx="398" cy="78" r="8" fill="#0E7C86"/><text x="398" y="82" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">2</text>
<text x="412" y="82" font-size="11" fill="#1F2328">Grid chip shows the inferred grid (tempo · meter). Tap =</text>
<text x="412" y="98" font-size="11" fill="#1F2328">re-open grid review. Never changes playback speed.</text>
<circle cx="398" cy="116" r="8" fill="#0E7C86"/><text x="398" y="120" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text>
<text x="412" y="120" font-size="11" fill="#1F2328">Undo is always visible (48dp). Label read aloud: &#x27;Undo</text>
<text x="412" y="136" font-size="11" fill="#1F2328">Capture layer 2&#x27;.</text>
<circle cx="398" cy="154" r="8" fill="#0E7C86"/><text x="398" y="158" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">4</text>
<text x="412" y="158" font-size="11" fill="#1F2328">Input chip: device name + &#x27;receiving&#x27; only after a real</text>
<text x="412" y="174" font-size="11" fill="#1F2328">message arrived. Shape: filled dot = live, ring =</text>
<text x="412" y="190" font-size="11" fill="#1F2328">connected-silent, ✕ = none.</text>
<circle cx="398" cy="208" r="8" fill="#0E7C86"/><text x="398" y="212" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">5</text>
<text x="412" y="212" font-size="11" fill="#1F2328">Audio chip: &#x27;Sound on&#x27; / &#x27;Tap to start sound&#x27; /</text>
<text x="412" y="228" font-size="11" fill="#1F2328">&#x27;Interrupted – tap to resume&#x27;. Text + icon, not colour</text>
<text x="412" y="244" font-size="11" fill="#1F2328">alone.</text>
<circle cx="398" cy="262" r="8" fill="#0E7C86"/><text x="398" y="266" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">6</text>
<text x="412" y="266" font-size="11" fill="#1F2328">History chip: how much recent playing Capture can reach</text>
<text x="412" y="282" font-size="11" fill="#1F2328">(proposed 120 s rolling + hard event/byte cap). Shows</text>
<text x="412" y="298" font-size="11" fill="#1F2328">&#x27;gap&#x27; if events were dropped under overload. No arming.</text>
<circle cx="398" cy="316" r="8" fill="#0E7C86"/><text x="398" y="320" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">7</text>
<text x="412" y="320" font-size="11" fill="#1F2328">Sound pill targets the selected layer. ◀ ▶ step sounds</text>
<text x="412" y="336" font-size="11" fill="#1F2328">while you keep playing; centre opens the Sound browser</text>
<text x="412" y="352" font-size="11" fill="#1F2328">sheet.</text>
<circle cx="398" cy="370" r="8" fill="#0E7C86"/><text x="398" y="374" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">8</text>
<text x="412" y="374" font-size="11" fill="#1F2328">Ribbon = the buffer made visible: what Capture will take.</text>
<text x="412" y="390" font-size="11" fill="#1F2328">Dashed bracket previews the likely phrase so the result is</text>
<text x="412" y="406" font-size="11" fill="#1F2328">predictable.</text>
<circle cx="398" cy="424" r="8" fill="#0E7C86"/><text x="398" y="428" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">9</text>
<text x="412" y="428" font-size="11" fill="#1F2328">Layer strip: ◎ marks the capture target (text &#x27;next&#x27;, ring</text>
<text x="412" y="444" font-size="11" fill="#1F2328">shape). Tap any layer to retarget. Long-press → layer</text>
<text x="412" y="460" font-size="11" fill="#1F2328">actions.</text>
<circle cx="398" cy="478" r="8" fill="#0E7C86"/><text x="398" y="482" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">10</text>
<text x="412" y="482" font-size="11" fill="#1F2328">Transport is secondary: capture never needs Play first.</text>
<text x="412" y="498" font-size="11" fill="#1F2328">Click (metronome) is opt-in.</text>
<circle cx="398" cy="516" r="8" fill="#0E7C86"/><text x="398" y="520" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">11</text>
<text x="412" y="520" font-size="11" fill="#1F2328">Capture: 112dp (proposed) tall, full width, bottom-centre.</text>
<text x="412" y="536" font-size="11" fill="#1F2328">Optionally mapped to any spare CC/button/pad (no spare</text>
<text x="412" y="552" font-size="11" fill="#1F2328">pedal required); sustain and playing keys are never taken</text>
<text x="412" y="568" font-size="11" fill="#1F2328">by default.</text>
<circle cx="398" cy="586" r="8" fill="#0E7C86"/><text x="398" y="590" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">12</text>
<text x="412" y="590" font-size="11" fill="#1F2328">Touch keys open as a drawer. Always labelled &#x27;on screen&#x27;</text>
<text x="412" y="606" font-size="11" fill="#1F2328">and never appear in the MIDI device list.</text>
</svg>