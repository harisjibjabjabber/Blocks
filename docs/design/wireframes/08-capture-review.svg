<circle cx="60" cy="262" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/><text x="60" y="266" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">2</text>
<circle cx="340" cy="420" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/><text x="340" y="424" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text>
<circle cx="340" cy="502" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/><text x="340" y="506" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">4</text>
<circle cx="340" cy="584" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/><text x="340" y="588" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">5</text>
<circle cx="340" cy="660" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/><text x="340" y="664" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">6</text>
<circle cx="340" cy="712" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/><text x="340" y="716" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">7</text>
<circle cx="398" cy="24" r="8" fill="#0E7C86"/><text x="398" y="28" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">1</text>
<text x="412" y="28" font-size="11" fill="#1F2328">Sheet is non-blocking: the loop keeps playing and the</text>
<text x="412" y="44" font-size="11" fill="#1F2328">controller keeps sounding. Undo reverts the capture. For</text>
<text x="412" y="60" font-size="11" fill="#1F2328">later layers the tempo is locked to the sketch.</text>
<circle cx="398" cy="78" r="8" fill="#0E7C86"/><text x="398" y="82" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">2</text>
<text x="412" y="82" font-size="11" fill="#1F2328">Notes played before the loop start stay in the take</text>
<text x="412" y="98" font-size="11" fill="#1F2328">(greyed, dashed). Moving the loop brings them back —</text>
<text x="412" y="114" font-size="11" fill="#1F2328">nothing is cropped.</text>
<circle cx="398" cy="132" r="8" fill="#0E7C86"/><text x="398" y="136" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text>
<text x="412" y="136" font-size="11" fill="#1F2328">Loop length chips re-map bars; never stretch audio or</text>
<text x="412" y="152" font-size="11" fill="#1F2328">notes. Selected chip has ✓ + filled shape.</text>
<circle cx="398" cy="170" r="8" fill="#0E7C86"/><text x="398" y="174" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">4</text>
<text x="412" y="174" font-size="11" fill="#1F2328">Beat one: step by beat, or tap any note in the mini-</text>
<text x="412" y="190" font-size="11" fill="#1F2328">timeline to make it &#x27;1&#x27;. Moves bar lines, not notes.</text>
<circle cx="398" cy="208" r="8" fill="#0E7C86"/><text x="398" y="212" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">5</text>
<text x="412" y="212" font-size="11" fill="#1F2328">&#x27;Count it as&#x27;: inferred tempo plus ½ / ×2 / manual</text>
<text x="412" y="228" font-size="11" fill="#1F2328">controls, always shown. Extra alternatives only when</text>
<text x="412" y="244" font-size="11" fill="#1F2328">inference justifies them; no confidence %. Meter 4/4 at</text>
<text x="412" y="260" font-size="11" fill="#1F2328">first. Re-maps bars; never speeds playback.</text>
<circle cx="398" cy="278" r="8" fill="#0E7C86"/><text x="398" y="282" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">6</text>
<text x="412" y="282" font-size="11" fill="#1F2328">Original take = hear the raw, unlooped performance exactly</text>
<text x="412" y="298" font-size="11" fill="#1F2328">as played. Always one tap away, in review and later from</text>
<text x="412" y="314" font-size="11" fill="#1F2328">the layer menu.</text>
<circle cx="398" cy="332" r="8" fill="#0E7C86"/><text x="398" y="336" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">7</text>
<text x="412" y="336" font-size="11" fill="#1F2328">Keep is the default: dismissing the sheet, playing on, or</text>
<text x="412" y="352" font-size="11" fill="#1F2328">capturing again keeps it. Discard is explicit and</text>
<text x="412" y="368" font-size="11" fill="#1F2328">undoable.</text>
</svg>