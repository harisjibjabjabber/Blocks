<text x="55.0" y="612.2" font-size="12" text-anchor="middle" fill="#ECEEF2" font-weight="650" letter-spacing="0.2">92 ✓</text>
<rect x="98" y="584" width="78" height="48" rx="12" fill="url(#ctl)" stroke="#2A3038" stroke-width="1"/>
<line x1="110" y1="585" x2="164" y2="585" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
<text x="137.0" y="612.2" font-size="12" text-anchor="middle" fill="#ECEEF2" font-weight="500" letter-spacing="0.2">×2 (184)</text>
<rect x="180" y="584" width="78" height="48" rx="12" fill="url(#ctl)" stroke="#2A3038" stroke-width="1"/>
<line x1="192" y1="585" x2="246" y2="585" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
<text x="219.0" y="612.2" font-size="12" text-anchor="middle" fill="#ECEEF2" font-weight="500" letter-spacing="0.2">½ (46)</text>
<rect x="262" y="584" width="78" height="48" rx="12" fill="url(#ctl)" stroke="#2A3038" stroke-width="1"/>
<line x1="274" y1="585" x2="328" y2="585" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
<text x="301.0" y="612.2" font-size="12" text-anchor="middle" fill="#ECEEF2" font-weight="500" letter-spacing="0.2">Set BPM…</text>
