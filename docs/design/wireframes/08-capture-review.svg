<line x1="276" y1="503" x2="332" y2="503" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
<text x="304.0" y="529.85" font-size="11" text-anchor="middle" fill="#ECEEF2" font-weight="500" letter-spacing="0.2">beat ▶</text>
<text x="16" y="576" font-size="12" text-anchor="start" fill="#ECEEF2" font-weight="650">Count it as</text>
