<rect x="504" y="136" width="14" height="20" rx="6" fill="none" stroke="#9AA3AF" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="512" y="168" font-size="9" text-anchor="middle" fill="#9AA3AF" font-weight="400">held</text>
<line x1="520" y1="70" x2="520" y2="210" stroke="#FF6A3D" stroke-width="2"/>
<text x="516" y="224" font-size="9" text-anchor="end" fill="#9AA3AF" font-weight="400">now</text>
<text x="290" y="248" font-size="11" text-anchor="start" fill="#ECEEF2" font-weight="400">Takes the last 4 bars you have played,</text>
<text x="290" y="264" font-size="11" text-anchor="start" fill="#ECEEF2" font-weight="400">ending at the last bar line already passed.</text>
<text x="290" y="288" font-size="11" text-anchor="start" fill="#ECEEF2" font-weight="400">Held note: released at loop end for</text>
<text x="290" y="304" font-size="11" text-anchor="start" fill="#ECEEF2" font-weight="400">playback only (marked); raw take unchanged.</text>
<rect x="290" y="322" width="232" height="48" rx="12" fill="url(#ctl)" stroke="#2A3038" stroke-width="1"/>
<line x1="302" y1="323" x2="510" y2="323" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
