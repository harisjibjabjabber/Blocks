<rect x="704.8" y="150" width="9.6" height="10" rx="3" fill="#C9D1DC" stroke="none" stroke-width="0"/>
<rect x="724.0" y="174" width="12.8" height="10" rx="3" fill="#C9D1DC" stroke="none" stroke-width="0"/>
<rect x="759.2" y="138" width="8.0" height="10" rx="3" fill="#C9D1DC" stroke="none" stroke-width="0"/>
<rect x="624" y="108" width="56" height="112" rx="12" fill="#2C1617" stroke="#E5484D" stroke-width="1.5"/>
<text x="652" y="168" font-size="10" text-anchor="middle" fill="#ECEEF2" font-weight="650">gap</text>
<text x="558" y="248" font-size="11" text-anchor="start" fill="#ECEEF2" font-weight="400">Input overload: Blocks could not keep</text>
<text x="558" y="264" font-size="11" text-anchor="start" fill="#ECEEF2" font-weight="400">every event between 0:41 and 0:43.</text>
<text x="558" y="288" font-size="11" text-anchor="start" fill="#9AA3AF" font-weight="400">Older playing beyond 2:00 leaves</text>
<text x="558" y="304" font-size="11" text-anchor="start" fill="#9AA3AF" font-weight="400">history normally (not an error).</text>
<rect x="558" y="322" width="232" height="48" rx="12" fill="url(#ctl)" stroke="#2A3038" stroke-width="1"/>
<line x1="570" y1="323" x2="778" y2="323" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
<text x="674.0" y="350.2" font-size="12" text-anchor="middle" fill="#ECEEF2" font-weight="500" letter-spacing="0.2">Capture anyway (gap marked)</text>
<rect x="558" y="378" width="232" height="48" rx="12" fill="url(#ctl)" stroke="#2A3038" stroke-width="1"/>
<line x1="570" y1="379" x2="778" y2="379" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
<text x="674.0" y="406.2" font-size="12" text-anchor="middle" fill="#ECEEF2" font-weight="500" letter-spacing="0.2">Hear original take</text>
<circle cx="794" cy="60" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/><text x="794" y="64" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">4</text>
<text x="826" y="58" font-size="11" text-anchor="start" fill="#ECEEF2" font-weight="400">Layers 1–4 all have parts.</text>
<text x="826" y="76" font-size="12" text-anchor="start" fill="#ECEEF2" font-weight="650">Where should this capture go?</text>
<rect x="826" y="92" width="232" height="56" rx="12" fill="url(#cap)" stroke="none" stroke-width="0"/>
<line x1="838" y1="93" x2="1046" y2="93" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>
<text x="942.0" y="124.2" font-size="12" text-anchor="middle" fill="#120C0A" font-weight="700" letter-spacing="0.2">New layer (when supported)</text>
<rect x="826" y="156" width="232" height="56" rx="12" fill="url(#ctl)" stroke="#2A3038" stroke-width="1"/>
<line x1="838" y1="157" x2="1046" y2="157" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
<text x="942.0" y="188.2" font-size="12" text-anchor="middle" fill="#ECEEF2" font-weight="500" letter-spacing="0.2">Replace layer… (choose, undoable)</text>
<rect x="826" y="220" width="232" height="56" rx="12" fill="url(#ctl)" stroke="#2A3038" stroke-width="1"/>
<line x1="838" y1="221" x2="1046" y2="221" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
<text x="942.0" y="252.2" font-size="12" text-anchor="middle" fill="#ECEEF2" font-weight="500" letter-spacing="0.2">Keep as take only</text>
<rect x="826" y="284" width="232" height="56" rx="12" fill="url(#ctl)" stroke="#2A3038" stroke-width="1"/>
<line x1="838" y1="285" x2="1046" y2="285" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
<text x="942.0" y="316.2" font-size="12" text-anchor="middle" fill="#ECEEF2" font-weight="500" letter-spacing="0.2">Cancel</text>
<text x="826" y="370" font-size="11" text-anchor="start" fill="#9AA3AF" font-weight="400">Nothing is merged or replaced silently.</text>
<circle cx="1062" cy="100" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/><text x="1062" y="104" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">5</text>
<circle cx="14" cy="664" r="8" fill="#0E7C86"/><text x="14" y="668" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">1</text>
<text x="28" y="668" font-size="11" fill="#1F2328">&#x27;No pulse&#x27; is a valid result: keep a free-time loop of the phrase, or set a tempo manually. No fabricated alternatives or confidence numbers.</text>
<circle cx="14" cy="686" r="8" fill="#0E7C86"/><text x="14" y="690" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">2</text>
<text x="28" y="690" font-size="11" fill="#1F2328">While playing: selects only bounded history already played on the existing transport — never future notes or a bar line not yet reached.</text>
<circle cx="14" cy="708" r="8" fill="#0E7C86"/><text x="14" y="712" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text>
<text x="28" y="712" font-size="11" fill="#1F2328">Queued join: the new layer starts at the next loop boundary. Held/active notes get synthetic releases for playback only, stored apart from raw events.</text>
<circle cx="14" cy="730" r="8" fill="#0E7C86"/><text x="14" y="734" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">4</text>
<text x="28" y="734" font-size="11" fill="#1F2328">Overload is a different state from normal age eviction: gaps/drops are flagged in the ribbon, the review and the take. Capture may fail or be partial; the UI never</text>
<text x="28" y="750" font-size="11" fill="#1F2328">promises otherwise.</text>
<circle cx="14" cy="768" r="8" fill="#0E7C86"/><text x="14" y="772" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">5</text>
<text x="28" y="772" font-size="11" fill="#1F2328">All slots full → an explicit choice. Default target is always an empty/new layer; never a silent destructive replace or merge.</text>
</svg>