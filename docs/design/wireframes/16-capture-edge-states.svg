<circle cx="526" cy="330" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/><text x="526" y="334" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text>
<rect x="558" y="52" width="232" height="44" rx="12" fill="#2A2312" stroke="#E0A43A" stroke-width="1.5"/>
<text x="674.0" y="78.2" font-size="12" text-anchor="middle" fill="#ECEEF2" font-weight="500" letter-spacing="0.2">⚠ Some notes dropped at 0:41</text>
<rect x="558" y="104" width="232" height="120" rx="12" fill="#14171C" stroke="none" stroke-width="0"/>
<rect x="567.2" y="138" width="9.6" height="10" rx="3" fill="#C9D1DC" stroke="none" stroke-width="0"/>
<rect x="586.4" y="162" width="8.0" height="10" rx="3" fill="#C9D1DC" stroke="none" stroke-width="0"/>
