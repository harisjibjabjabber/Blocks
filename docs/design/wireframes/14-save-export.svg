<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 746" width="1080" height="746" font-family="Inter, Roboto, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Save, recovery and export (PROPOSED)</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="0" y="0" width="1080" height="640" rx="8" fill="#FFFFFF" stroke="#1F2328" stroke-width="2"/>
<text x="1072" y="632" font-size="9" text-anchor="end" fill="#5B6470" font-weight="400">PROPOSED · not implemented · sizes are proposals pending measurement</text>
<rect x="8" y="8" width="344" height="604" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="20" y="38" font-size="16" text-anchor="start" fill="#1F2328" font-weight="600">Recovered sketch</text>
<text x="20" y="62" font-size="11" text-anchor="start" fill="#1F2328" font-weight="400">Blocks closed unexpectedly. &#x27;Sketch 14&#x27; was</text>
<text x="20" y="78" font-size="11" text-anchor="start" fill="#1F2328" font-weight="400">restored from 2 min ago (4 layers, 3 edits).</text>
<rect x="20" y="100" width="320" height="120" rx="8" fill="#F3F4F6" stroke="#E3E6EA" stroke-width="1"/>
<text x="180.0" y="163.85" font-size="11" text-anchor="middle" fill="#1F2328" font-weight="400">preview: layers 1–4 thumbnails</text>
<rect x="20" y="236" width="320" height="56" rx="8" fill="#2F6FEB" stroke="#2F6FEB" stroke-width="1"/>
<text x="180.0" y="268.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="600">Open restored sketch</text>
<rect x="20" y="300" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="180.0" y="328.2" font-size="12" text-anchor="middle" fill="#1F2328" font-weight="400">Open last saved version instead</text>
<text x="20" y="380" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">Both versions are kept until you choose.</text>
<rect x="368" y="8" width="344" height="604" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<rect x="368" y="8" width="344" height="88" rx="8" fill="#FFF4D6" stroke="#B7791F" stroke-width="1.5"/>
<text x="380" y="38" font-size="14" text-anchor="start" fill="#1F2328" font-weight="600">Couldn&#x27;t save — storage full</text>
<text x="380" y="60" font-size="11" text-anchor="start" fill="#1F2328" font-weight="400">Your sketch is safe while Blocks stays open.</text>
<rect x="380" y="68" width="100" height="24" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="430.0" y="83.5" font-size="10" text-anchor="middle" fill="#1F2328" font-weight="400">Retry</text>
<rect x="488" y="68" width="120" height="24" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="548.0" y="83.5" font-size="10" text-anchor="middle" fill="#1F2328" font-weight="400">Export now</text>
<text x="380" y="130" font-size="12" text-anchor="start" fill="#1F2328" font-weight="600">Autosave status (sketch menu)</text>
<text x="380" y="152" font-size="11" text-anchor="start" fill="#1F2328" font-weight="400">● Saved on this device · 14:02 (UTC)</text>
<text x="380" y="172" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">Saving… / Not saved – retrying in 5 s</text>
<text x="380" y="212" font-size="12" text-anchor="start" fill="#1F2328" font-weight="600">Version history</text>
<rect x="380" y="224" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="540.0" y="251.85" font-size="11" text-anchor="middle" fill="#1F2328" font-weight="400">14:02 · captured layer 2</text>
<rect x="380" y="280" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="540.0" y="307.85" font-size="11" text-anchor="middle" fill="#1F2328" font-weight="400">13:58 · changed sound</text>
<rect x="380" y="336" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="540.0" y="363.85" font-size="11" text-anchor="middle" fill="#1F2328" font-weight="400">13:51 · first capture</text>
<rect x="728" y="8" width="344" height="604" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="740" y="38" font-size="16" text-anchor="start" fill="#1F2328" font-weight="600">Export Sketch 14</text>
<rect x="740" y="56" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#1F2328" stroke-width="3"/>
<text x="900.0" y="84.2" font-size="12" text-anchor="middle" fill="#1F2328" font-weight="600">MIDI file · all layers ✓</text>
<rect x="740" y="112" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="900.0" y="140.2" font-size="12" text-anchor="middle" fill="#1F2328" font-weight="400">MIDI · one file per layer</text>
<rect x="740" y="168" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#1F2328" stroke-width="3"/>
<text x="900.0" y="196.2" font-size="12" text-anchor="middle" fill="#1F2328" font-weight="600">Audio stems · WAV, aligned ✓</text>
<rect x="740" y="224" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="900.0" y="252.2" font-size="12" text-anchor="middle" fill="#1F2328" font-weight="400">Mixdown · WAV</text>
<text x="740" y="302" font-size="12" text-anchor="start" fill="#1F2328" font-weight="600">Timing</text>
<rect x="740" y="312" width="156" height="48" rx="8" fill="#FFFFFF" stroke="#1F2328" stroke-width="3"/>
<text x="818.0" y="340.2" font-size="12" text-anchor="middle" fill="#1F2328" font-weight="600">As edited ✓</text>
<rect x="904" y="312" width="156" height="48" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="982.0" y="340.2" font-size="12" text-anchor="middle" fill="#1F2328" font-weight="400">Original take</text>
<text x="740" y="384" font-size="12" text-anchor="start" fill="#1F2328" font-weight="600">Length</text>
<rect x="740" y="394" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="900.0" y="422.2" font-size="12" text-anchor="middle" fill="#1F2328" font-weight="400">Length: Loop × 4 (32 bars) · change ▾</text>
<text x="740" y="466" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">Stems share start + one length; tail follows the sound&#x27;s release.</text>
<rect x="740" y="488" width="320" height="56" rx="8" fill="#2F6FEB" stroke="#2F6FEB" stroke-width="1"/>
<text x="900.0" y="520.9" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="600">Export &amp; share…</text>
<rect x="740" y="552" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="900.0" y="580.2" font-size="12" text-anchor="middle" fill="#1F2328" font-weight="400">Cancel</text>
<circle cx="14" cy="12" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="0"/><text x="14" y="16" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">1</text>
<circle cx="374" cy="12" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="0"/><text x="374" y="16" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">2</text>
<circle cx="734" cy="12" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="0"/><text x="734" y="16" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text>
<circle cx="14" cy="664" r="8" fill="#0E7C86"/><text x="14" y="668" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">1</text>
<text x="28" y="668" font-size="11" fill="#1F2328">Recovery never silently picks: restored vs last-saved are both offered, and both are kept until one is chosen.</text>
<circle cx="14" cy="686" r="8" fill="#0E7C86"/><text x="14" y="690" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">2</text>
<text x="28" y="690" font-size="11" fill="#1F2328">Save failure is a persistent banner (not a toast) with Retry and an escape hatch: export.</text>
<circle cx="14" cy="708" r="8" fill="#0E7C86"/><text x="14" y="712" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text>
<text x="28" y="712" font-size="11" fill="#1F2328">Export: MIDI + aligned stems (stems = later milestone). Length visible/changeable. Raw CC64/bend/pressure kept; synthetic note-offs not exported.</text>
</svg>