<text x="412" y="28" font-size="11" fill="#1F2328">Audition is playing: tapping a row loads it on the target</text>
<text x="412" y="44" font-size="11" fill="#1F2328">layer while you keep playing. No separate preview mode to</text>
<text x="412" y="60" font-size="11" fill="#1F2328">forget.</text>
<circle cx="398" cy="78" r="8" fill="#0E7C86"/><text x="398" y="82" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">2</text>
<text x="412" y="82" font-size="11" fill="#1F2328">Categories are large chips (48dp, proposed); search for</text>
<text x="412" y="98" font-size="11" fill="#1F2328">names. Sound names are PLACEHOLDERS until the sound set is</text>
<text x="412" y="114" font-size="11" fill="#1F2328">chosen — no asset is promised.</text>
<circle cx="398" cy="132" r="8" fill="#0E7C86"/><text x="398" y="136" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text>
<text x="412" y="136" font-size="11" fill="#1F2328">Favourite star is its own 48dp target, separated from the</text>
<text x="412" y="152" font-size="11" fill="#1F2328">row action by 8dp; state read as &#x27;Favourite, on&#x27;.</text>
<circle cx="398" cy="170" r="8" fill="#0E7C86"/><text x="398" y="174" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">4</text>
<text x="412" y="174" font-size="11" fill="#1F2328">Every sound change is one undo step (&#x27;Back to previous&#x27;).</text>
<text x="412" y="190" font-size="11" fill="#1F2328">Controller ◀ ▶ sound steps are learnable.</text>
