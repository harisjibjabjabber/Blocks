<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" width="800" height="780" font-family="Inter, Roboto, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">First run — connect sound + keyboard (readiness) (PROPOSED)</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="0" y="0" width="360" height="780" rx="8" fill="#FFFFFF" stroke="#1F2328" stroke-width="2"/>
<text x="352" y="772" font-size="9" text-anchor="end" fill="#5B6470" font-weight="400">PROPOSED · not implemented · sizes are proposals pending measurement</text>
<text x="20" y="48" font-size="24" text-anchor="start" fill="#1F2328" font-weight="600">Let&#x27;s make sound</text>
<text x="20" y="74" font-size="13" text-anchor="start" fill="#5B6470" font-weight="400">Two things, then just play.</text>
<rect x="8" y="96" width="344" height="172" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="24" y="124" font-size="16" text-anchor="start" fill="#1F2328" font-weight="600">1  Sound</text>
<text x="24" y="148" font-size="13" text-anchor="start" fill="#1F2328" font-weight="400">Status: Not started</text>
<text x="24" y="168" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">One tap starts audio, then asks for MIDI.</text>
<rect x="24" y="184" width="312" height="64" rx="8" fill="#2F6FEB" stroke="#2F6FEB" stroke-width="1"/>
<text x="180.0" y="221.25" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="600">Start (sound, then MIDI)</text>
<rect x="8" y="280" width="344" height="212" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="24" y="308" font-size="16" text-anchor="start" fill="#1F2328" font-weight="600">2  MIDI keyboard</text>
<text x="24" y="332" font-size="13" text-anchor="start" fill="#1F2328" font-weight="400">✓ Keystation 61 connected (USB)</text>
<text x="24" y="352" font-size="12" text-anchor="start" fill="#5B6470" font-weight="400">Not yet heard — play any key to test</text>
<rect x="24" y="368" width="312" height="56" rx="8" fill="#F3F4F6" stroke="#E3E6EA" stroke-width="1"/>
<text x="180.0" y="400.55" font-size="13" text-anchor="middle" fill="#1F2328" font-weight="400">Waiting for a note…  ◌</text>
<rect x="24" y="432" width="152" height="48" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="100.0" y="460.2" font-size="12" text-anchor="middle" fill="#1F2328" font-weight="400">Choose device ▾</text>
<rect x="184" y="432" width="152" height="48" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="260.0" y="460.2" font-size="12" text-anchor="middle" fill="#1F2328" font-weight="400">Help connecting</text>
<rect x="8" y="504" width="344" height="132" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="24" y="532" font-size="16" text-anchor="start" fill="#1F2328" font-weight="600">No keyboard?</text>
<text x="24" y="556" font-size="12" text-anchor="start" fill="#5B6470" font-weight="400">Play the on-screen touch keys instead.</text>
<text x="24" y="574" font-size="11" text-anchor="start" fill="#5B6470" font-weight="400">They are a touch instrument, not a MIDI device.</text>
<rect x="24" y="584" width="312" height="44" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="180.0" y="610.55" font-size="13" text-anchor="middle" fill="#1F2328" font-weight="400">Use touch keys</text>
<rect x="8" y="660" width="344" height="72" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1"/>
<text x="180.0" y="702.3" font-size="18" text-anchor="middle" fill="#1F2328" font-weight="400">Start playing →</text>
<text x="180" y="752" font-size="10" text-anchor="middle" fill="#5B6470" font-weight="400">Start playing enables once Sound is on (keyboard optional).</text>
<circle cx="14" cy="100" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="0"/><text x="14" y="104" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">1</text>
<circle cx="14" cy="284" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="0"/><text x="14" y="288" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">2</text>
<circle cx="14" cy="508" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="0"/><text x="14" y="512" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text>
<circle cx="14" cy="664" r="9" fill="#0E7C86" stroke="#FFFFFF" stroke-width="0"/><text x="14" y="668" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">4</text>
<circle cx="398" cy="24" r="8" fill="#0E7C86"/><text x="398" y="28" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">1</text>
<text x="412" y="28" font-size="11" fill="#1F2328">Web: one explicit enable gesture resumes audio and then</text>
<text x="412" y="44" font-size="11" fill="#1F2328">requests MIDI. The browser&#x27;s own prompt varies by</text>
<text x="412" y="60" font-size="11" fill="#1F2328">browser/state, so the touch count is not fixed. Native:</text>
<text x="412" y="76" font-size="11" fill="#1F2328">auto-starts.</text>
<circle cx="398" cy="94" r="8" fill="#0E7C86"/><text x="398" y="98" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">2</text>
<text x="412" y="98" font-size="11" fill="#1F2328">Connected ≠ receiving. The card only says &#x27;Receiving ✓ C4</text>
<text x="412" y="114" font-size="11" fill="#1F2328">vel 72&#x27; after a real Note On arrives (proves the cable,</text>
<text x="412" y="130" font-size="11" fill="#1F2328">channel, and permission).</text>
<circle cx="398" cy="148" r="8" fill="#0E7C86"/><text x="398" y="152" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text>
<text x="412" y="152" font-size="11" fill="#1F2328">Touch keys are offered as an equal path, labelled as on-</text>
<text x="412" y="168" font-size="11" fill="#1F2328">screen; choosing them never marks the MIDI card ready.</text>
<circle cx="398" cy="186" r="8" fill="#0E7C86"/><text x="398" y="190" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="700">4</text>
<text x="412" y="190" font-size="11" fill="#1F2328">One primary action per card; the final CTA is plain once</text>
<text x="412" y="206" font-size="11" fill="#1F2328">sound is on. Order: sound first, so the first key press is</text>
<text x="412" y="222" font-size="11" fill="#1F2328">heard.</text>
</svg>